# LMU Pitwall relay — Traefik dynamic configuration (file provider)
#
# Change the hostname below and drop this in the directory named by
# --providers.file.directory.
#
# Traefik's docker provider CANNOT express this route: it derives a service's
# address from the container carrying the labels, and the relay is a host
# process under systemd, not a container. Hence a file provider, which is the
# only thing that has to be added to an existing Traefik — every other route
# can keep coming from docker labels.
#
# The traefik container also needs a read-only mount of that directory and:
#     extra_hosts:
#       - "host.docker.internal:host-gateway"
# host-gateway rather than a hardcoded bridge IP, which Docker reassigns if the
# network is ever recreated.
#
# Serves a dashboard over HTTP and accepts one streaming agent on /uplink over
# WebSocket. Traefik v3 proxies the Upgrade handshake with no extra
# configuration, so there is no middleware here.
#
# NOTE: the dashboard is deliberately UNAUTHENTICATED — only the streaming
# agent needs a key. Anyone with this hostname can watch the telemetry. That is
# the product decision, not an oversight.
http:
  routers:
    lmu-pitwall:
      rule: "Host(`live.example.com`)"
      entryPoints:
        - websecure
      service: lmu-pitwall
      tls:
        certResolver: letsencrypt
  services:
    lmu-pitwall:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:9000"
